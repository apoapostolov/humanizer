# Hermes house prose config for the writing skill.
# Usage: vale --config vale/vale.ini <file-or-dir>
# StylesPath is relative to this file.

StylesPath = styles
MinAlertLevel = suggestion
Vocab = Hermes

Packages = Microsoft

[*]
BasedOnStyles = Microsoft, HermesHouse, Vale
Vale.Spelling = YES
Vale.Repetition = YES
Vale.Terms = NO

# Microsoft style whitelist: keep only rules that add value without
# duplicating HermesHouse rules (single voice per issue).
Microsoft.Passive = YES
Microsoft.SentenceLength = YES
Microsoft.HeadingPunctuation = YES
Microsoft.Acronyms = YES
Microsoft.Dashes = NO
Microsoft.Adverbs = NO
Microsoft.Avoid = NO
Microsoft.Contractions = NO
Microsoft.Jargon = NO
Microsoft.Spelling = NO
Microsoft.Terms = NO
Microsoft.Vocab = NO
Microsoft.We = NO
Microsoft.Weasel = NO
Microsoft.Wordiness = NO
Microsoft.FirstPerson = NO
Microsoft.Uppercase = NO
Microsoft.Gender = NO
Microsoft.GenderBias = NO
Microsoft.BiasFree = NO
Microsoft.Militaristic = NO
Microsoft.Negative = NO
Microsoft.ExclamationPoints = NO
Microsoft.Quotes = NO
Microsoft.Ordinal = NO
Microsoft.Numerals = NO
Microsoft.Percentages = NO
Microsoft.Hyphens = NO
Microsoft.Accessibility = NO
Microsoft.Auto = NO
Microsoft.DateFormat = NO
Microsoft.DateNumbers = NO
Microsoft.DateOrder = NO
Microsoft.Ellipses = NO
Microsoft.GeneralURL = NO
Microsoft.HeadingAcronyms = NO
Microsoft.HeadingColons = NO
Microsoft.Headings = NO
Microsoft.OxfordComma = NO
Microsoft.RangeTime = NO
Microsoft.Semicolon = NO
Microsoft.Spacing = NO
Microsoft.Suspended = NO
Microsoft.URLFormat = NO
