name: ai-writing-detector

on:
  push:
    paths:
      - "skills/ai-writing-detector/**"
      - ".github/workflows/ai-writing-detector.yml"
  pull_request:
    paths:
      - "skills/ai-writing-detector/**"
      - ".github/workflows/ai-writing-detector.yml"
  workflow_dispatch:

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run smoke
        run: bash skills/ai-writing-detector/scripts/smoke.sh
